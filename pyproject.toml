[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "universal-game-agent"
version = "0.1.0"
description = "Local, measurable agents for authorized game testing, analysis and creation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "pydantic>=2.11,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "Pillow>=11,<13", "psutil>=7,<8",
]

[project.optional-dependencies]
capture = ["mss>=10,<11"]

[project.scripts]
uga = "uga.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/uga"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: component integration", "performance: bounded benchmark", "external: requires explicit executable approval"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
